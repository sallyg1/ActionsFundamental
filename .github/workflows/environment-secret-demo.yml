name: Environment Secret Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test"
        type: environment
        required: true

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Show environment configuration
        run: |
          echo "Selected environment: ${{ inputs.environment }}"
          echo "API endpoint: ${{ vars.DEMO_ENDPOINT }}"

      - name: Verify environment secret
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -z "$DEMO_API_KEY" ]; then
            echo "::error::DEMO_API_KEY is not configured for this environment."
            exit 1
          fi

          echo "DEMO_API_KEY was securely injected."
          echo "Secret value intentionally not printed."
