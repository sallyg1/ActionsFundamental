name: "Hello World Composite Action"
description: "Create a greeting, capture runner details, and write a summary."

inputs:
  who:
    description: "Who to greet"
    required: true
    default: "World"

outputs:
  greeting:
    description: "The generated greeting."
    value: ${{ steps.create-greeting.outputs.greeting }}
  runner_os:
    description: "The operating system supplied by the caller job."
    value: ${{ steps.capture-runner.outputs.runner_os }}

runs:
  using: "composite"
  steps:
    - name: Create greeting
      id: create-greeting
      shell: bash
      env:
        WHO: ${{ inputs.who }}
      run: |
        greeting="Hello ${WHO} from a composite action!"
        echo "$greeting"
        echo "greeting=$greeting" >> "$GITHUB_OUTPUT"

    - name: Capture caller runner
      id: capture-runner
      shell: bash
      run: |
        echo "Runner OS: $RUNNER_OS"
        echo "runner_os=$RUNNER_OS" >> "$GITHUB_OUTPUT"

    - name: Write workflow summary
      shell: bash
      env:
        GREETING: ${{ steps.create-greeting.outputs.greeting }}
      run: |
        echo "## Composite Action Result" >> "$GITHUB_STEP_SUMMARY"
        echo "$GREETING" >> "$GITHUB_STEP_SUMMARY"
        echo "Runner: $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
