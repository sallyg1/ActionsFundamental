name: "Hello World JavaScript Action"
description: "Create a greeting and return the execution time."

inputs:
  who:
    description: "Who to greet"
    required: true
    default: "World"

outputs:
  greeting:
    description: "The generated greeting."
  time:
    description: "The UTC execution time."

runs:
  using: "node24"
  main: "index.js"
